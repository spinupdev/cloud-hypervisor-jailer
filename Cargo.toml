[package]
name = "cloud-hypervisor-jailer"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Cloud Hypervisor sandbox launcher for Depot"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.15"

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: package release asset
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/cloud-hypervisor-jailer dist/
          tar -C dist -czf cloud-hypervisor-jailer-x86_64-unknown-linux-musl.tar.gz cloud-hypervisor-jailer
          sha256sum cloud-hypervisor-jailer-x86_64-unknown-linux-musl.tar.gz > cloud-hypervisor-jailer-x86_64-unknown-linux-musl.tar.gz.sha256
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            cloud-hypervisor-jailer-x86_64-unknown-linux-musl.tar.gz \
            cloud-hypervisor-jailer-x86_64-unknown-linux-musl.tar.gz.sha256
